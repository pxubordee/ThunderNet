name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rojo
        run: |
          curl -fsSL -o rojo.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          echo "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  rojo.zip" \
            | sha256sum --check --strict
          unzip -q rojo.zip
          chmod +x rojo
          sudo mv rojo /usr/local/bin/rojo
          rojo --version

      - name: Install Luau
        run: |
          curl -fsSL -o luau.zip \
            https://github.com/luau-lang/luau/releases/download/0.746/luau-ubuntu.zip
          echo "30f11c9cde8be2dc0e3066d210705532aac3726a2db89a6c5078080b6faa6cf8  luau.zip" \
            | sha256sum --check --strict
          unzip -q luau.zip -d luau-bin
          chmod +x luau-bin/luau luau-bin/luau-analyze
          sudo mv luau-bin/luau luau-bin/luau-analyze /usr/local/bin/

      - name: Verify tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "VERSION ($version) does not match tag ($tag)" >&2
            exit 1
          fi

      - name: Verify tests, analysis and packages
        run: ./scripts/check.sh

      - name: Write checksum and release notes
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          package="build/ThunderNet-${version}.rbxm"
          checksum="$(sha256sum "$package" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$checksum" "$(basename "$package")" > "${package}.sha256"
          cat > build/release-notes.md <<EOF
          ## ThunderNet For Roblox ${version}

          Full name: **ThunderNetworking.** Typed, server-authoritative networking
          for Roblox.

          ### Install

          1. Download \`ThunderNet-${version}.rbxm\` below.
          2. In Roblox Studio, insert the model into \`ReplicatedStorage\`.
          3. Rename the inserted model to \`ThunderNet\` if Studio added a suffix.
          4. Require it with \`ReplicatedStorage:WaitForChild("ThunderNet")\`.

          The \`.rbxm\` from this release is the only supported distribution.

          ### Verify the download

          \`\`\`
          sha256sum -c ThunderNet-${version}.rbxm.sha256
          \`\`\`

          SHA-256: \`${checksum}\`

          ### License and security

          MIT License. Copyright (c) 2026 pxubordee. The full notice is included in
          the model as the \`LICENSE\` child.

          Report vulnerabilities privately using the process in SECURITY.md. Do not
          open a public issue with exploit details. ThunderNet has not undergone an
          independent third-party security audit.

          Full changelog:
          https://github.com/pxubordee/ThunderNet/blob/main/CHANGELOG.md
          EOF

      - name: Attest release package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/ThunderNet-*.rbxm

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          gh release create "$GITHUB_REF_NAME" \
            "build/ThunderNet-${version}.rbxm" \
            "build/ThunderNet-${version}.rbxm.sha256" \
            --title "ThunderNet For Roblox $GITHUB_REF_NAME" \
            --notes-file build/release-notes.md \
            --verify-tag
