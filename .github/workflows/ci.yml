name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rojo
        run: |
          curl -fsSL -o rojo.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          echo "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  rojo.zip" \
            | sha256sum --check --strict
          unzip -q rojo.zip
          chmod +x rojo
          sudo mv rojo /usr/local/bin/rojo
          rojo --version

      - name: Install Luau
        run: |
          curl -fsSL -o luau.zip \
            https://github.com/luau-lang/luau/releases/download/0.746/luau-ubuntu.zip
          echo "30f11c9cde8be2dc0e3066d210705532aac3726a2db89a6c5078080b6faa6cf8  luau.zip" \
            | sha256sum --check --strict
          unzip -q luau.zip -d luau-bin
          chmod +x luau-bin/luau luau-bin/luau-analyze
          sudo mv luau-bin/luau luau-bin/luau-analyze /usr/local/bin/

      - name: Verify tests, analysis and packages
        run: ./scripts/check.sh

      - name: Upload packaged model
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ThunderNet-rbxm
          path: build/ThunderNet-*.rbxm
          if-no-files-found: error
          retention-days: 14
